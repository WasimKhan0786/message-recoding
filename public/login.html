<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AudioFlow - Secure Admin Authentication Portal">
  <title>Admin Login — AudioFlow</title>

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Core Theme & Login Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><path d='M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z'/></svg>">
</head>
<body class="auth-body">

  <!-- Ambient Glow Elements -->
  <div class="auth-glow glow-top"></div>
  <div class="auth-glow glow-bottom"></div>

  <main class="auth-container">
    <div class="auth-card">
      
      <!-- Brand Header -->
      <div class="auth-header">
        <a href="/" class="brand-logo auth-logo" title="Back to AudioFlow">
          <div class="logo-icon-wrapper">
            <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 10v4" />
              <path d="M6 6v12" />
              <path d="M10 3v18" />
              <path d="M14 7v10" />
              <path d="M18 5v14" />
              <path d="M22 11v2" />
            </svg>
          </div>
          <span class="brand-text">Audio<span class="brand-accent">Flow</span></span>
        </a>

        <div class="auth-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span>Admin Portal</span>
        </div>

        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to manage the AudioFlow sound ecosystem.</p>
      </div>

      <!-- Feedback Alert Boxes -->
      <div id="alertBox" class="alert-box hidden" role="alert" aria-live="polite">
        <div class="alert-icon" id="alertIcon"></div>
        <div class="alert-message" id="alertMessage"></div>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="auth-form" novalidate>
        
        <!-- Email Field -->
        <div class="form-group">
          <label for="email" class="form-label">Admin Email</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
              </svg>
            </span>
            <input 
              type="email" 
              id="email" 
              name="email" 
              class="form-input" 
              placeholder="admin@audioflow.local" 
              autocomplete="email" 
              required
              autofocus
            >
          </div>
          <span class="field-error" id="emailError"></span>
        </div>

        <!-- Password Field with Show/Hide Toggle -->
        <div class="form-group">
          <div class="label-row">
            <label for="password" class="form-label">Password</label>
          </div>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-input" 
              placeholder="Enter your password" 
              autocomplete="current-password" 
              required
            >
            <button 
              type="button" 
              id="togglePassword" 
              class="password-toggle-btn" 
              aria-label="Show password"
              title="Show password"
            >
              <!-- Eye open icon -->
              <svg id="eyeOpenIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <!-- Eye off icon (hidden initially) -->
              <svg id="eyeOffIcon" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                <line x1="2" y1="2" x2="22" y2="22"></line>
              </svg>
            </button>
          </div>
          <span class="field-error" id="passwordError"></span>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="btn btn-primary btn-block btn-lg auth-submit-btn">
          <span id="btnText">Sign In to Admin</span>
          <span id="btnSpinner" class="spinner hidden"></span>
        </button>

      </form>

      <!-- Card Footer Notice -->
      <div class="auth-footer-note">
        <p class="security-notice">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
          Restricted access. Session activities are logged and rate-limited.
        </p>
        <a href="/" class="back-link">&larr; Return to Homepage</a>
      </div>

    </div>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
